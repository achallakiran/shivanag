<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Voxel Cricket">
<meta name="theme-color" content="#0d1f16">
<title>Voxel Cricket</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0d1f16;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{position:fixed;inset:0;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#fatal{position:fixed;left:0;right:0;bottom:0;max-height:40%;overflow:auto;margin:0;padding:8px;background:rgba(120,0,0,.92);color:#fff;font:11px/1.3 ui-monospace,Menlo,monospace;z-index:100;white-space:pre-wrap;touch-action:pan-y}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<pre id="fatal" hidden></pre>
<script>
(function () {
  function show(msg) {
    var p = document.getElementById('fatal');
    if (!p) return;
    p.hidden = false;
    p.textContent += msg + '\n';
  }
  window.__showError = show;
  window.addEventListener('error', function (e) {
    show('Error: ' + (e.message || '') + (e.filename ? ' @' + String(e.filename).split('/').pop() + ':' + e.lineno : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    show('Promise: ' + ((r && (r.stack || r.message)) || r));
  });
})();
</script>
<script>window.__APP__=%%APPINFO%%;</script>
<script>%%BUNDLE%%</script>
</body>
</html>
